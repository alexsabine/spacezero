<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow">
<title>Frame studies (lab page, not part of the site)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --parchment:      #f4f1eb;
  --parchment-warm: #ede6d4;
  --ink:            #1a1612;
  --ink-soft:       #3a3530;
  --muted:          #7a6f5f;
  --rule:           rgba(26, 22, 18, 0.10);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
}

.lab-header {
  max-width: 640px;
  margin: 0 auto;
  padding: 72px 24px 56px;
  text-align: center;
}
.lab-flag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 20px;
}
.lab-title {
  font-size: clamp(1.7rem, 3.6vw, 2.3rem);
  font-weight: 400;
  margin: 0 0 18px;
  line-height: 1.3;
}
.lab-intro {
  font-size: 1.08rem;
  font-style: italic;
  line-height: 1.6;
  color: var(--ink-soft);
  margin: 0;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px 120px;
}

.option {
  padding: 56px 0;
  border-top: 1px solid var(--rule);
  text-align: center;
}
.option:first-child { border-top: 1px solid var(--rule); }
.option-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 8px;
}
.option-title {
  font-size: 1.7rem;
  font-weight: 500;
  margin: 0 0 12px;
}
.option-note {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 46ch;
  margin: 0 auto 36px;
}

/* ─── Portrait geometry — same proportions as /who ───────────────── */
.pair {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 64px;
  flex-wrap: wrap;
}
.portrait-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  flex-shrink: 0;
  overflow: visible;
}
.portrait-canvas {
  position: absolute;
  top: -42px;
  left: -42px;
  width: calc(100% + 84px);
  height: calc(100% + 84px);
  display: block;
  pointer-events: none;
}
.portrait-placeholder {
  position: absolute;
  top: 1px; left: 1px; right: 1px; bottom: 1px;
  background: var(--parchment-warm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 62px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  border-radius: 50%;
  border: 1px solid rgba(26, 22, 18, 0.85);
  box-sizing: border-box;
}

/* Bridge wrap — sits between the two portraits in options that draw a
   connecting wash. Same height as a portrait so the geometry lines up. */
.bridge-wrap {
  position: relative;
  width: 64px;
  height: 200px;
  flex-shrink: 0;
  margin: 0 -20px;
}
.bridge-canvas {
  position: absolute;
  top: -42px;
  left: -42px;
  width: calc(100% + 84px);
  height: calc(100% + 84px);
  pointer-events: none;
}

footer {
  text-align: center;
  padding: 0 24px 64px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<header class="lab-header">
  <p class="lab-flag">Lab page — not linked from the site</p>
  <h1 class="lab-title">A few ways the ring could breathe with the person next to it</h1>
  <p class="lab-intro">Same idea underneath each one. Different questions about how much of it should show.</p>
</header>

<main id="options"></main>

<footer>space-zero / ent_test &middot; private study, do not link</footer>

<script>
(function () {
'use strict';

const PI  = Math.PI;
const PHI = (1 + Math.sqrt(5)) / 2;
const TAU = 2 * PI;
const GOLDEN_ANGLE = TAU / (PHI * PHI);

// ─── Palette — the same coastal set /who draws from ─────────────────
const PAL = {
  ink:            [ 26,  22,  18],
  parchmentWarm:  [237, 230, 212],
  amberCream:     [248, 216, 168],
  amberWarm:      [200, 145,  91],
  russet:         [176, 102,  60],
  iceplantBright: [222, 178, 200],
  iceplantPale:   [240, 218, 230],
  riverShallow:   [191, 216, 208],
  riverJade:      [103, 135,  88],
  flare:          [255, 246, 214],
};
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const lerp3 = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

// A quiet colour path from cool to warm to a soft flare, standing in for
// what accumulating toward release might feel like as a temperature
// rather than a number.
const HUE_STOPS = [
  { t: 0.00, c: PAL.riverShallow },
  { t: 0.35, c: PAL.iceplantPale },
  { t: 0.65, c: PAL.amberWarm    },
  { t: 0.88, c: PAL.russet       },
  { t: 1.00, c: PAL.flare        },
];
function qualiaColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < HUE_STOPS.length - 1; i++) {
    const a = HUE_STOPS[i], b = HUE_STOPS[i + 1];
    if (t >= a.t && t <= b.t) return lerp3(a.c, b.c, (t - a.t) / (b.t - a.t || 1));
  }
  return HUE_STOPS[HUE_STOPS.length - 1].c;
}

// ─── A CRR oscillator — one running, monotonic accumulator standing in
// for coherence. It never wraps and never jolts; rupture is read off it
// as a boundary crossing, not stored as a flag. ────────────────────────
function makeOsc(omega, phase0) {
  return { omega, phase: phase0 || Math.random() * TAU, prevPhase: 0 };
}
function stepOsc(o, dt, coupling) {
  o.prevPhase = o.phase;
  o.phase += (o.omega + (coupling || 0)) * dt;
}
function crossed(prev, curr, ell) { return Math.floor(curr / ell) > Math.floor(prev / ell); }
function fracOf(phase, ell) { const m = phase % ell; return (m < 0 ? m + ell : m) / ell; }

const BASE_OMEGA = TAU / 10;
const COUPLING_K = 0.4;

function fitCanvas(canvas) {
  const dpr = Math.max(1.5, Math.min(window.devicePixelRatio || 1, 3));
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

// ─── Shared ring painter ─────────────────────────────────────────────
// The canvas overhangs the portrait circle by OVERHANG px on each side
// (matching the CSS), so the ring must sit OUTSIDE the placeholder's own
// radius, in that overhang margin — the placeholder <div> paints on top
// of the canvas, so anything drawn inside its radius is simply hidden.
const OVERHANG = 42;
function paintRing(ctx, w, h, frac, styleAlpha, glowExtra) {
  const cx = w / 2, cy = h / 2;
  const wrapR = Math.min(w, h) / 2 - OVERHANG;   // the placeholder's own radius
  const R = wrapR + 6;                            // ring sits just outside it
  ctx.clearRect(0, 0, w, h);

  const col = qualiaColor(frac);
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';

  ctx.strokeStyle = rgba(col, styleAlpha);
  if (glowExtra > 0) {
    ctx.shadowColor = rgba(col, Math.min(0.7, glowExtra));
    ctx.shadowBlur = 16 * glowExtra;
  }
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();
  ctx.shadowBlur = 0;

  return { cx, cy, R, col };
}

function paintPetals(ctx, cx, cy, R, petals, t) {
  for (const p of petals) {
    const age = t - p.born;
    const w8 = Math.exp(-age / 9);
    if (w8 < 0.02) continue;
    const pr = R * 1.08;
    const px = cx + Math.cos(p.angle) * pr, py = cy + Math.sin(p.angle) * pr;
    const blobR = R * 0.20;
    const g = ctx.createRadialGradient(px, py, 0, px, py, blobR);
    g.addColorStop(0, rgba(p.col, 0.32 * w8));
    g.addColorStop(1, rgba(p.col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, blobR, 0, TAU); ctx.fill();
  }
}

function paintBloom(ctx, cx, cy, R, amount, col) {
  if (amount <= 0) return;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.25);
  g.addColorStop(0, rgba(col, 0.38 * amount));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.6, 0, TAU); ctx.fill();
}

function paintBridge(ctx, w, h, coherence, mixCol) {
  if (coherence < 0.03) return;
  const cx = w / 2, cy = h / 2;
  const halfW = w * 0.42, halfH = h * 0.22;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(halfW / halfH, 1);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, halfH);
  g.addColorStop(0.00, rgba(mixCol, 1));
  g.addColorStop(0.45, rgba(mixCol, 0.7));
  g.addColorStop(1.00, rgba(mixCol, 0));
  ctx.globalAlpha = 0.5 * coherence;
  ctx.fillStyle = g;
  ctx.fillRect(-halfH * 1.3, -halfH * 1.3, halfH * 2.6, halfH * 2.6);
  ctx.restore();
}

// ─── Build one option's DOM: eyebrow, title, note, a pair of portraits
// (and, when withBridge, a connecting wash between them). ─────────────
const optionsRoot = document.getElementById('options');
function buildOption(eyebrow, title, note, withBridge, letters) {
  const section = document.createElement('section');
  section.className = 'option';
  section.innerHTML = `
    <p class="option-eyebrow">${eyebrow}</p>
    <h2 class="option-title">${title}</h2>
    <p class="option-note">${note}</p>
    <div class="pair">
      <div class="portrait-wrap">
        <canvas class="portrait-canvas"></canvas>
        <div class="portrait-placeholder">${letters[0]}</div>
      </div>
      ${withBridge ? '<div class="bridge-wrap"><canvas class="bridge-canvas"></canvas></div>' : ''}
      <div class="portrait-wrap">
        <canvas class="portrait-canvas"></canvas>
        <div class="portrait-placeholder">${letters[1]}</div>
      </div>
    </div>
  `;
  optionsRoot.appendChild(section);
  return section;
}

const animators = []; // { update(dt,t), draw(t) }

function makePair(section, omegaSpread) {
  const wraps = section.querySelectorAll('.portrait-wrap');
  const canvases = Array.from(wraps).map(w => w.querySelector('.portrait-canvas'));
  const fits = canvases.map(fitCanvas);
  const oscA = makeOsc(BASE_OMEGA * (1 - omegaSpread), 0.4);
  const oscB = makeOsc(BASE_OMEGA * (1 + omegaSpread), 3.1);
  const bridgeCanvas = section.querySelector('.bridge-canvas');
  const bridgeFit = bridgeCanvas ? fitCanvas(bridgeCanvas) : null;
  return { fits, oscA, oscB, bridgeFit };
}

function coupleStep(oscA, oscB, dt) {
  const cA = COUPLING_K * Math.sin(oscB.phase - oscA.phase);
  const cB = COUPLING_K * Math.sin(oscA.phase - oscB.phase);
  stepOsc(oscA, dt, cA);
  stepOsc(oscB, dt, cB);
}

// ═══ Option 1 — Tide ═══════════════════════════════════════════════
// The ring simply breathes, warming and cooling with the pair's shared
// rhythm. Closest to what's live now, with a slower colour underneath it.
(function () {
  const section = buildOption('Option 1', 'Tide',
    'The rings just breathe — warming together, cooling together, never a hard edge.',
    false, ['A', 'B']);
  const { fits, oscA, oscB } = makePair(section, 0.12);
  animators.push({
    update(dt) { coupleStep(oscA, oscB, dt); },
    draw() {
      [oscA, oscB].forEach((o, i) => {
        const { ctx, w, h } = fits[i];
        const frac = fracOf(o.phase, TAU);
        const breath = 0.55 + 0.35 * Math.sin(o.phase * 0.5);
        paintRing(ctx, w, h, frac, breath, 0);
      });
    },
  });
})();

// ═══ Option 2 — Threshold ══════════════════════════════════════════
// Quiet almost all the time. The ring only really appears in the last
// stretch before release, and lets go in one soft exhale.
(function () {
  const section = buildOption('Option 2', 'Threshold',
    'Quiet until it isn’t. The ring gathers itself unseen, then lets go in one breath.',
    false, ['C', 'D']);
  const { fits, oscA, oscB } = makePair(section, 0.08);
  const flash = [0, 0];
  [oscA, oscB].forEach((o) => { o._prevFrac = 0; });
  animators.push({
    update(dt) {
      coupleStep(oscA, oscB, dt);
      [oscA, oscB].forEach((o, i) => {
        if (crossed(o.prevPhase, o.phase, TAU)) flash[i] = 0;
        flash[i] += dt;
      });
    },
    draw() {
      [oscA, oscB].forEach((o, i) => {
        const { ctx, w, h } = fits[i];
        const frac = fracOf(o.phase, TAU);
        // visible only in the last quarter of the cycle
        const visible = Math.max(0, (frac - 0.7) / 0.3);
        const bloomAmt = Math.max(0, 1 - flash[i] / 1.1);
        const { cx, cy, R, col } = paintRing(ctx, w, h, frac, 0.15 + 0.65 * visible, 0);
        paintBloom(ctx, cx, cy, R, bloomAmt, col);
      });
    },
  });
})();

// ═══ Option 3 — Shared Bridge ══════════════════════════════════════
// The rings themselves stay understated; nearly all the feeling sits in
// the gap between the two, which warms exactly when they let go together.
(function () {
  const section = buildOption('Option 3', 'Shared Bridge',
    'The rings barely speak for themselves. Watch the space between the two instead.',
    true, ['E', 'F']);
  const { fits, oscA, oscB, bridgeFit } = makePair(section, 0.05);
  animators.push({
    update(dt) { coupleStep(oscA, oscB, dt); },
    draw() {
      const fracs = [oscA, oscB].map(o => fracOf(o.phase, TAU));
      let cols = [];
      [oscA, oscB].forEach((o, i) => {
        const { ctx, w, h } = fits[i];
        const { col } = paintRing(ctx, w, h, fracs[i], 0.30, 0);
        cols.push(col);
      });
      if (bridgeFit) {
        const { ctx, w, h } = bridgeFit;
        ctx.clearRect(0, 0, w, h);
        const dPhi = oscA.phase - oscB.phase;
        const coherence = 0.5 + 0.5 * Math.cos(dPhi);
        const mix = [
          (cols[0][0] * cols[1][0]) / 255,
          (cols[0][1] * cols[1][1]) / 255,
          (cols[0][2] * cols[1][2]) / 255,
        ];
        paintBridge(ctx, w, h, coherence, mix);
      }
    },
  });
})();

// ═══ Option 4 — Afterglow ══════════════════════════════════════════
// Like Tide, but every release leaves the faintest petal just outside
// the ring, so a soft, slowly-turning trail of the recent past collects.
(function () {
  const section = buildOption('Option 4', 'Afterglow',
    'Every letting-go leaves the faintest trace, turning slowly outside the ring, then gone.',
    false, ['G', 'H']);
  const { fits, oscA, oscB } = makePair(section, 0.10);
  const petals = [[], []];
  animators.push({
    update(dt, t) {
      coupleStep(oscA, oscB, dt);
      [oscA, oscB].forEach((o, i) => {
        if (crossed(o.prevPhase, o.phase, TAU)) {
          const col = qualiaColor(0.95);
          petals[i].push({ angle: petals[i].length * GOLDEN_ANGLE, col, born: t });
          if (petals[i].length > 8) petals[i].shift();
        }
      });
    },
    draw(t) {
      [oscA, oscB].forEach((o, i) => {
        const { ctx, w, h } = fits[i];
        const frac = fracOf(o.phase, TAU);
        const breath = 0.5 + 0.3 * Math.sin(o.phase * 0.5);
        const { cx, cy, R } = paintRing(ctx, w, h, frac, breath, 0);
        paintPetals(ctx, cx, cy, R, petals[i], t);
      });
    },
  });
})();

// ═══ Option 5 — Twin Breath ════════════════════════════════════════
// One slow, continuous glow travels around the band with no fixed start;
// twice on its way round, the whole ring gives a soft, fuller pulse —
// a heartbeat nested inside a longer, unmarked turning.
(function () {
  const section = buildOption('Option 5', 'Twin Breath',
    'A slow light circles with no marked start. Twice each turn, the whole ring softly pulses.',
    false, ['I', 'J']);
  const { fits, oscA, oscB } = makePair(section, 0.06);
  const pulse = [10, 10];
  animators.push({
    update(dt) {
      coupleStep(oscA, oscB, dt);
      [oscA, oscB].forEach((o, i) => {
        if (crossed(o.prevPhase, o.phase, PI)) pulse[i] = 0;
        pulse[i] += dt;
      });
    },
    draw() {
      [oscA, oscB].forEach((o, i) => {
        const { ctx, w, h } = fits[i];
        const frac = fracOf(o.phase, TAU);
        const pulseAmt = Math.max(0, 1 - pulse[i] / 1.4) * 0.35;
        const { cx, cy, R } = paintRing(ctx, w, h, frac, 0.42 + pulseAmt, pulseAmt * 0.6);

        // the travelling point of light, no start marked
        const a = o.phase;
        const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
        const g = ctx.createRadialGradient(px, py, 0, px, py, R * 0.20);
        const col = qualiaColor(frac);
        g.addColorStop(0, rgba(col, 0.85));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, R * 0.20, 0, TAU); ctx.fill();
      });
    },
  });
})();

// ─── Master loop ─────────────────────────────────────────────────────
let t0 = performance.now();
let lastT = t0;
const DT_CAP = 0.033;
function frame(now) {
  const t = (now - t0) / 1000;
  const dt = Math.min(DT_CAP, (now - lastT) / 1000);
  lastT = now;
  for (const a of animators) a.update(dt, t);
  for (const a of animators) a.draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>

</body>
</html>
